name: Trading Bot Automata Futtatas

on:
  schedule:
    - cron: '0 6,12,18 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Szukseges csomagok telepitese
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests yfinance

      - name: Bot futtatása
        run: python bot.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Jelentes mentese (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: trading-report
          path: trading-report.csv
