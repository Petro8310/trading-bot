
name: Trading Bot Automata Futtatas

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1-5' # Hétfőtől péntekig minden reggel 8:00-kor (UTC)

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Kod letoltese
        uses: actions/checkout@v4

      - name: Python telepitese
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Szukseges csomagok telepitese
        run: |
          pip install yfinance requests matplotlib

      - name: Bot futtatasa
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python bot.py
